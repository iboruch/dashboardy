version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - FRONTEND_URL=http://localhost:4200
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    command: python main.py

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

  # Optional: Redis for caching
